name: Close settled issues
# Closes open issues whose "deployed" label is at least 7 days old (see scripts/roadmap-sync.mjs).
on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST
  workflow_dispatch:
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/roadmap-sync.mjs --close-stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
