name: Sync roadmap
# Moves viewer roadmap rows on issue labels and maintainers' /roadmap comments.
# See scripts/roadmap-sync.mjs. Needs the HD2_ADMIN_TOKEN repository secret.
on:
  issues:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  sync:
    # Labels can only be changed by people with triage access. Comments can come from
    # anyone, so only /roadmap comments from maintainers on issues (not PRs) start the job.
    if: >-
      (github.event_name == 'issues' && !github.event.issue.pull_request &&
        contains(fromJSON('["roadmap","in-progress","deployed"]'), github.event.label.name)) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/roadmap') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # One run per issue at a time (set on the job so skipped events never queue). A newer
    # pending run may replace an older one; every run reads the current labels anyway.
    concurrency:
      group: roadmap-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/roadmap-sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HD2_ADMIN_TOKEN: ${{ secrets.HD2_ADMIN_TOKEN }}
